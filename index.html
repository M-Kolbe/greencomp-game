<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenComp Trails</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Experience GreenComp: twelve skills, five trails, one card set. A window for sound, voice and picture, a board for the room, a solo walk. No account, no tracking.">
<meta name="theme-color" content="#13201a">
<meta property="og:type" content="website">
<meta property="og:title" content="GreenComp erleben">
<meta property="og:description" content="Ein Kartenspiel für draussen: zwölf Fähigkeiten für die Nachhaltigkeit, Schritt für Schritt erlebt. Ohne Konto.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout concept: dawn over the Alps opens the app; Swiss trail signs (yellow arrows, white-red-white blazes) carry every way in;
   paper cards carry the content; one colour per GreenComp area; a bento of tiles for the ways in; the room board reads at a distance. */
:root {
  --bg: #f1f4ee;
  --bg-2: #e5ebe1;
  --paper: #fdfefc;
  --ink: #13201a;
  --ink-2: #4c5c52;
  --line: #d2dacd;
  --sign: #f6c600;
  --sign-ink: #15201a;
  --blaze: #c62f28;
  --a-values: #3b7633;
  --a-complex: #1d6687;
  --a-futures: #6a4d99;
  --a-acting: #ad422c;
  --on-area: #ffffff;
  --board: #cdb68c;
  --board-ink: #2a2117;
  --head: #13201a;
  --head-ink: #edf1ea;
  --night: #0b110d;
  --night-ink: #e9efe7;
  --night-2: #9aab9e;
  --focus: #0d4fc2;
  --qr-bg: #ffffff;
  --qr-ink: #111111;
  --hero-sky-1: #1c3850;
  --hero-sky-2: #c98a5e;
  --hero-sky-3: #efc895;
  --hero-sun: #fff1c9;
  --hero-sun-glow: rgba(255, 210, 140, .55);
  --hero-m1: #8c9fb1;
  --hero-m2: #5d7d84;
  --hero-m3: #3e6955;
  --hero-m4: #284d3a;
  --hero-m5: #163021;
  --hero-bird: rgba(16, 26, 20, .55);
  --hero-night: 0;
  --hero-ink: #ffffff;
  --way-sky: #dcebf2;
  --way-m1: #a9bdb0;
  --way-m2: #73a070;
  --way-snow: #ffffff;
  --way-tree: #3b673c;
  --shadow: 0 1px 0 rgba(19, 32, 26, .06), 0 14px 32px -18px rgba(19, 32, 26, .4);
  --shadow-lift: 0 2px 0 rgba(19, 32, 26, .06), 0 22px 40px -18px rgba(19, 32, 26, .45);

  --f-sign: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
  --f-text: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --s-0: .8125rem; --s-1: .9375rem; --s-2: 1.0625rem; --s-3: 1.3125rem; --s-4: 1.625rem; --s-5: 2.125rem; --s-6: 2.875rem;
  --r: 18px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1511; --bg-2: #131c17; --paper: #18221c; --ink: #e7eee5; --ink-2: #a3b2a6; --line: #2b3a31;
    --blaze: #e2554c; --a-values: #7dbb70; --a-complex: #62b4d8; --a-futures: #b19ae0; --a-acting: #ea8467; --on-area: #0e1511;
    --board: #7e6a4b; --board-ink: #f3ead9; --head: #090e0b; --head-ink: #e7eee5; --night: #060a08; --focus: #ffd84d;
    --hero-sky-1: #040912; --hero-sky-2: #13223a; --hero-sky-3: #26344c; --hero-sun: #e8edf7; --hero-sun-glow: rgba(190, 210, 255, .16);
    --hero-m1: #2b394a; --hero-m2: #213039; --hero-m3: #192a23; --hero-m4: #111f18; --hero-m5: #0a130e; --hero-bird: rgba(220, 230, 240, .45); --hero-night: 1;
    --way-sky: #0f1a24; --way-m1: #24352c; --way-m2: #1a2b21; --way-snow: #cfd8e3; --way-tree: #13261b;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .8); --shadow-lift: 0 2px 0 rgba(0, 0, 0, .4), 0 22px 40px -18px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1511; --bg-2: #131c17; --paper: #18221c; --ink: #e7eee5; --ink-2: #a3b2a6; --line: #2b3a31;
  --blaze: #e2554c; --a-values: #7dbb70; --a-complex: #62b4d8; --a-futures: #b19ae0; --a-acting: #ea8467; --on-area: #0e1511;
  --board: #7e6a4b; --board-ink: #f3ead9; --head: #090e0b; --head-ink: #e7eee5; --night: #060a08; --focus: #ffd84d;
  --hero-sky-1: #040912; --hero-sky-2: #13223a; --hero-sky-3: #26344c; --hero-sun: #e8edf7; --hero-sun-glow: rgba(190, 210, 255, .16);
  --hero-m1: #2b394a; --hero-m2: #213039; --hero-m3: #192a23; --hero-m4: #111f18; --hero-m5: #0a130e; --hero-bird: rgba(220, 230, 240, .45); --hero-night: 1;
  --way-sky: #0f1a24; --way-m1: #24352c; --way-m2: #1a2b21; --way-snow: #cfd8e3; --way-tree: #13261b;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .8); --shadow-lift: 0 2px 0 rgba(0, 0, 0, .4), 0 22px 40px -18px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head); }
body.has-ov { overflow: hidden; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.12; margin: 0; }
p { margin: 0; }
a { color: inherit; }
img, svg, canvas { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--sign); color: var(--sign-ink); padding: 10px 14px; font-weight: 700; border-radius: 8px; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 10px); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gut-r); }
.stack { display: grid; gap: 14px; align-content: start; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.eyebrow { font-family: var(--f-sign); font-weight: 600; text-transform: uppercase; letter-spacing: .09em; font-size: var(--s-1); color: var(--ink-2); }
.lead { font-size: var(--s-3); line-height: 1.45; max-width: 36em; }
.muted { color: var(--ink-2); }
.small { font-size: var(--s-0); }
.num { font-variant-numeric: tabular-nums; }
.display { font-family: var(--f-sign); font-weight: 700; font-size: var(--s-5); line-height: 1; }

/* ---------- header & tab bar ---------- */
.site { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--head) 94%, transparent); color: var(--head-ink); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); }
.site .wrap { display: flex; align-items: center; gap: 18px; min-height: 60px; padding-block: 6px; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--head-ink); }
.mark-blaze { width: 30px; height: 20px; display: grid; grid-template-rows: 1fr 1fr 1fr; border-radius: 3px; overflow: hidden; flex: none; }
.mark-blaze i:nth-child(1), .mark-blaze i:nth-child(3) { background: #fff; }
.mark-blaze i:nth-child(2) { background: #c62f28; }
.mark b { font-family: var(--f-sign); font-weight: 700; font-size: 1.45rem; letter-spacing: .02em; line-height: 1; }
.mark small { display: block; font-family: var(--f-sign); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { font-family: var(--f-sign); font-weight: 600; font-size: 1.12rem; text-decoration: none; padding: 7px 13px; border-radius: 999px; color: var(--head-ink); }
.nav a:hover { background: rgba(255, 255, 255, .1); }
.nav a[aria-current="page"] { background: var(--sign); color: var(--sign-ink); }
.langs { display: flex; border: 1.5px solid rgba(255, 255, 255, .3); border-radius: 999px; overflow: hidden; }
.langs button { background: none; border: 0; padding: 4px 11px; font-family: var(--f-sign); font-weight: 700; font-size: 1rem; cursor: pointer; color: var(--head-ink); }
.langs button[aria-pressed="true"] { background: var(--head-ink); color: var(--head); }
.tabbar { display: none; }
@media (max-width: 760px) {
  .site { position: relative; top: 0; }
  .nav { display: none; }
  .langs { margin-left: auto; }
  .mark b { font-size: 1.22rem; }
  body { padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: color-mix(in srgb, var(--head) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); border-top: 1px solid rgba(255, 255, 255, .08); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; text-decoration: none; color: var(--head-ink); font-family: var(--f-sign); font-weight: 600; font-size: .86rem; opacity: .8; }
  .tabbar a[aria-current="page"] { opacity: 1; color: var(--sign); }
  .tabbar .tab-ico { width: 24px; height: 24px; }
  .toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- buttons & signs ---------- */
.ico { width: 1.2em; height: 1.2em; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 20px; border-radius: 999px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; font-family: var(--f-sign); font-weight: 700; font-size: 1.18rem; letter-spacing: .01em; line-height: 1.1; transition: transform .15s, background .15s, box-shadow .15s; }
.btn:hover { background: var(--bg-2); }
.btn:active { transform: scale(.97); }
.btn--sign { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); box-shadow: 0 8px 18px -10px rgba(246, 198, 0, .9); }
.btn--sign:hover { background: var(--sign); filter: brightness(1.05); }
.btn--glass { background: rgba(255, 255, 255, .14); color: var(--hero-ink); border-color: rgba(255, 255, 255, .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.btn--glass:hover { background: rgba(255, 255, 255, .24); }
.btn--ghost { border-color: transparent; }
.btn--small { min-height: 38px; padding: 6px 14px; font-size: 1.02rem; }
.btn--big { min-height: 54px; padding: 12px 26px; font-size: 1.3rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.link { font-weight: 700; text-underline-offset: 3px; }
.sign { --tip: 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--sign); color: var(--sign-ink); clip-path: polygon(0 0, calc(100% - var(--tip)) 0, 100% 50%, calc(100% - var(--tip)) 100%, 0 100%); padding: 9px calc(var(--tip) + 12px) 9px 14px; min-height: 46px; font-family: var(--f-sign); font-weight: 700; font-size: 1.22rem; line-height: 1.1; text-decoration: none; border-radius: 4px 0 0 4px; transition: transform .15s; }
.sign:hover, .sign:focus-visible { filter: brightness(1.06); transform: translateX(3px); }
.sign .t { font-weight: 600; font-size: 1rem; white-space: nowrap; opacity: .85; }
.sign > span { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.blaze { display: inline-grid; grid-template-rows: 1fr 1fr 1fr; width: 22px; height: 15px; flex: none; border-radius: 2px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); }
.blaze i { background: #fff; } .blaze i:nth-child(2) { background: var(--area, var(--blaze)); }
.chip { border: 1.5px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 5px 13px; font-family: var(--f-sign); font-weight: 600; font-size: 1.05rem; cursor: pointer; transition: transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.chip--ghost { border-color: var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.score-pill { display: inline-flex; padding: 3px 12px; border-radius: 999px; background: var(--sign); color: var(--sign-ink); font-family: var(--f-sign); font-weight: 700; font-size: 1rem; margin-left: 6px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-sign); font-weight: 600; font-size: .95rem; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; border: 1.5px dashed currentColor; color: var(--ink-2); }

/* ---------- hero ---------- */
.hero-band { position: relative; overflow: hidden; background: var(--hero-sky-1); color: var(--hero-ink); isolation: isolate; }
.hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
.hero-band::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(6, 14, 10, .62) 0%, rgba(6, 14, 10, .3) 46%, rgba(6, 14, 10, 0) 70%); }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); gap: 40px; align-items: center; padding-block: 64px 96px; }
.hero h1 { font-family: var(--f-sign); font-weight: 700; font-size: clamp(3rem, 8.4vw, 6.4rem); line-height: .92; letter-spacing: -.01em; margin: 10px 0 18px; text-shadow: 0 2px 24px rgba(0, 0, 0, .35); }
.hero .lead { text-shadow: 0 1px 12px rgba(0, 0, 0, .45); }
.hero-eyebrow { color: rgba(255, 255, 255, .86); }
.hero .row { margin-top: 26px; }
.hero-note { color: rgba(255, 255, 255, .9); text-align: center; min-height: 1.3em; }
@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; gap: 28px; padding-block: 36px 64px; }
  .hero-band::after { background: linear-gradient(180deg, rgba(6, 14, 10, .62), rgba(6, 14, 10, .38) 60%, rgba(6, 14, 10, .2)); }
}

/* coaster: the drawing is the printed coaster (deckel.js); here only the flip and the shadow of a round board */
.coaster-wrap { perspective: 1200px; display: grid; justify-items: center; gap: 10px; }
.coaster { width: min(300px, 78vw); aspect-ratio: 1; max-width: 100%; position: relative; border: 0; padding: 0; background: none; cursor: pointer; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); filter: drop-shadow(0 16px 22px rgba(0, 0, 0, .38)); border-radius: 50%; }
.coaster.flip { transform: rotateY(180deg); }
.coaster.flick { animation: flick 1.1s cubic-bezier(.2, .8, .3, 1); }
@keyframes flick { 0% { transform: translateY(0) rotateX(0); } 45% { transform: translateY(-56px) rotateX(540deg); } 100% { transform: translateY(0) rotateX(720deg); } }
.coaster-face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.coaster-back { transform: rotateY(180deg); }
.coaster-svg { display: block; width: 100%; height: auto; }
.coaster:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }


/* draw */
.big-choice { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; text-align: left; padding: 18px 20px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; color: var(--ink); }
.big-choice:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.big-choice .ico { grid-row: span 2; width: 46px; height: 46px; padding: 9px; border-radius: 14px; background: var(--bg-2); }
.big-choice b { font-family: var(--f-sign); font-size: 1.55rem; line-height: 1.05; }
.big-choice span { color: var(--ink-2); font-size: var(--s-1); }
.big-choice--sign { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.big-choice--sign span { color: var(--sign-ink); opacity: .82; }
.big-choice--sign .ico { background: rgba(255, 255, 255, .45); }

/* bento */
.section-head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
.section-head h2 { font-family: var(--f-sign); font-weight: 700; font-size: var(--s-6); line-height: 1; }
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.tile { position: relative; display: grid; align-content: start; gap: 8px; padding: 22px 22px 46px; border-radius: 24px; background: var(--paper); border: 1px solid var(--line); text-decoration: none; box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s; min-width: 0; }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.tile h3 { font-family: var(--f-sign); font-size: 1.65rem; line-height: 1.02; }
.tile p { color: var(--ink-2); }
.tile-ico { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--bg-2); }
.tile-ico .ico { width: 26px; height: 26px; }
.tile-go { position: absolute; right: 20px; bottom: 14px; font-family: var(--f-sign); font-weight: 700; font-size: 1.5rem; }
.tile--hero { grid-column: span 2; grid-row: span 2; background: linear-gradient(150deg, var(--a-complex), var(--a-values)); color: #fff; border: 0; padding: 28px 28px 56px; }
.tile--hero h3 { font-size: clamp(2rem, 4vw, 3rem); }
.tile--hero p { color: rgba(255, 255, 255, .88); font-size: var(--s-3); }
.tile--hero .tile-ico { background: rgba(255, 255, 255, .2); color: #fff; }
.tile-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.tile-tags i { font-style: normal; font-family: var(--f-sign); font-weight: 600; padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, .18); }
.tile--finds { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-bottom: 22px; }
.tile--finds .tile-go { position: static; margin-left: auto; }
.tile--finds .mini-finds { margin-left: 8px; }
.mini-finds { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-finds i { width: 26px; height: 26px; border-radius: 50%; border: 2px dashed var(--line); }
.mini-finds i.got { background: var(--fc); border: 0; }
.ring { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 6; }
.ring-fg { fill: none; stroke: var(--a-futures); stroke-width: 6; stroke-linecap: round; }
@media (max-width: 980px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tile--hero { grid-row: span 1; } }
@media (max-width: 560px) { .bento { grid-template-columns: 1fr; } .tile--hero { grid-column: auto; } .tile--finds .mini-finds { margin-left: 0; width: 100%; } }

.band { background: var(--bg-2); }
.band > .wrap { padding-block: 40px; }
.posts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 20px; }
@media (max-width: 980px) { .posts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .posts { grid-template-columns: 1fr; } }
.post { position: relative; display: grid; gap: 8px; padding-left: 16px; min-width: 0; }
.post::before { content: ""; position: absolute; left: 0; top: 4px; bottom: -8px; width: 7px; border-radius: 3px; background: var(--ink-2); opacity: .5; }
.post-head { display: flex; align-items: center; gap: 10px; font-family: var(--f-sign); font-weight: 700; font-size: 1.28rem; line-height: 1.05; min-height: 46px; padding: 8px 12px; border-radius: 6px; background: var(--paper); border: 2px solid var(--ink); text-decoration: none; }
.post .sign:nth-of-type(3) { margin-right: 6px; } .post .sign:nth-of-type(4) { margin-right: 12px; }

/* ---------- cards ---------- */
.card { --area: var(--ink-2); position: relative; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 18px; min-width: 0; }
.card-body { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.card-type { display: flex; align-items: center; gap: 8px; font-family: var(--f-sign); font-weight: 600; font-size: .98rem; letter-spacing: .07em; text-transform: uppercase; color: var(--area); padding-right: 30px; }
.card-edge { position: absolute; top: 18px; right: 16px; width: 18px; height: 18px; background: var(--area); }
.edge-circle { border-radius: 50%; } .edge-diamond { transform: rotate(45deg) scale(.85); } .edge-tri { clip-path: polygon(50% 0, 100% 100%, 0 100%); } .edge-square { border-radius: 2px; }
.edge-stripe { width: 12px; height: 26px; background: linear-gradient(#fff 0 33%, var(--blaze) 33% 67%, #fff 67%); box-shadow: 0 0 0 1px var(--line); border-radius: 2px; }
.edge-arrow { clip-path: polygon(0 20%, 55% 20%, 55% 0, 100% 50%, 55% 100%, 55% 80%, 0 80%); }
.card-q { font-weight: 700; font-size: var(--s-4); line-height: 1.18; text-wrap: balance; }
.card-task { border-top: 2px solid var(--area); padding-top: 12px; display: grid; gap: 6px; }
.card-task .label, .lbl { font-family: var(--f-sign); font-weight: 700; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase; color: var(--area); }
.card-foot { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 6px; }
.card-foot .qr { width: 64px; flex: none; }
.card-foot p { font-size: var(--s-0); color: var(--ink-2); line-height: 1.35; }
.card-def { font-size: var(--s-1); font-style: italic; }
.card--big .card-q { font-size: clamp(1.75rem, 3.6vw, 2.4rem); }
.card--big { padding: 28px 28px 20px; border-radius: 26px; }
.card-flip { align-self: flex-start; }
.card.dealt { animation: deal .7s cubic-bezier(.2, .9, .3, 1.15); }
.card.flipping { animation: flipc .36s ease-in-out; }
@keyframes deal { from { transform: translateY(30px) rotate(-4deg) scale(.96); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes flipc { 50% { transform: rotateY(90deg) scale(.98); } }

.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
/* A small card always looks like the printed card. Everything inside scales with the card's width,
   so a card that fits in print fits on every screen too. Format 70 x 120 mm (tarot): bigger type for cold hands outdoors. */
.mini { aspect-ratio: 70 / 120; padding: 0; gap: 0; overflow: hidden; border-radius: 14px; container-type: inline-size; }
.mini > .card-body { padding: 5.88cqi 5.88cqi 5.04cqi; gap: 3.78cqi; font-size: 6.72cqi; line-height: 1.32; min-height: 0; }
.mini .card-type { font-size: .82em; gap: 3.36cqi; padding-right: 12.6cqi; }
.mini .task-ex { display: block; font-size: .86em; font-style: italic; color: var(--ink-2); margin-top: .2em; }
.mini .card-edge { top: 5.04cqi; right: 4.62cqi; width: 5.88cqi; height: 5.88cqi; }
.mini .card-q { font-size: 1.1em; }
.mini p { font-size: .86em; line-height: 1.32; }
.mini .card-task { padding-top: 3.36cqi; gap: 1.26cqi; }
.mini .lbl { font-size: .78em; }
.mini .card-task .label { font-size: .74em; }
.mini .card-task p { font-size: .8em; line-height: 1.26; }
.mini .card-foot { gap: 3.36cqi; padding-top: 0; }
/* the code on a card: 20 mm with about 3 mm of white around it, so phones read it in back light */
.mini .card-foot .qr { width: 31.4cqi; padding: 1.4cqi; background: var(--qr-bg); border-radius: 1.2cqi; }
.mini .card-foot p { font-size: .68em; line-height: 1.22; }
.mini .big { font-family: var(--f-sign); font-weight: 700; font-size: 1.75em; line-height: 1.02; }
.mini .card-plain { font-size: .74em; line-height: 1.24; margin-top: -2.1cqi; }
.mini .task-steps { font-size: .8em; gap: .9cqi; line-height: 1.24; padding-left: 1.25em; }
.mini .task-done { font-size: .74em; line-height: 1.22; }
.mini .card-def { font-size: .72em; line-height: 1.24; }
/* the back holds the definition, the solo form, the second form and the window code */
.mini .cb-back .card-def { font-size: .62em; line-height: 1.17; }
.card.mini .card-body.cb-back .card-task { padding-top: 1.8cqi; }
.mini .cb-back .card-task p { font-size: .71em; line-height: 1.2; }
.card.mini:not([class*="is-"]) > .card-body { gap: 2.52cqi; }
.card.mini:not([class*="is-"]) .card-type { font-size: .8em; letter-spacing: .04em; padding-right: 9.24cqi; }
.card.mini:not([class*="is-"]) .card-q { font-size: 1.06em; line-height: 1.16; }
.card.mini:not([class*="is-"]) .card-task { padding-top: 2.52cqi; gap: .84cqi; }
.mini.is-area { background: var(--area); color: var(--on-area); border-color: var(--area); }
.mini.is-area .card-type, .mini.is-area .lbl { color: var(--on-area); }
.mini.is-area .card-edge { background: var(--on-area); }
.mini.is-trail { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); clip-path: polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%); border-radius: 14px 14px 0 0; }
.mini.is-trail .card-type { color: var(--sign-ink); }
.mini.is-trail .card-edge { background: var(--sign-ink); }
.mini.is-talk { border-radius: 50%; aspect-ratio: 1; text-align: center; color: #fff; border: 0; background: var(--photo, #556); }
.mini.is-talk > .card-body { padding: 13.5cqi 12cqi 12.5cqi; gap: 3cqi; justify-content: center; }
.mini.is-talk .card-type { color: #fff; justify-content: center; padding-right: 0; font-size: .7em; text-wrap: balance; }
.mini.is-talk .card-edge { display: none; }
.mini.is-talk .card-q { font-size: .98em; text-shadow: 0 1px 8px rgba(0, 0, 0, .45); }
.mini.is-talk p { color: rgba(255, 255, 255, .9); text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.mini.is-talk p:not(.card-q) { font-size: .7em; }
.mini.is-promise { border-top: 3px dashed var(--line); }
.mini .lines { display: grid; gap: 9.24cqi; margin-top: 3.36cqi; }
.mini .lines i { border-bottom: 1.5px dashed var(--line); }
.mini.is-silence { border-color: var(--ink); }
.mini.is-gap { border-style: dashed; box-shadow: none; background: transparent; }
.mini .back-pattern { flex: 1; border-radius: 3.36cqi; background: repeating-linear-gradient(135deg, var(--area) 0 4.2cqi, transparent 4.2cqi 8.4cqi); opacity: .22; }

.booklet { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.booklet-item { padding: 18px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); border-left: 6px solid var(--area); display: grid; gap: 8px; }
.booklet-q { font-weight: 700; }
.booklet-a { font-family: var(--f-sign); font-weight: 700; font-size: 1.4rem; line-height: 1.15; }

/* ---------- competence page ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 22px 8px; font-family: var(--f-sign); font-weight: 600; font-size: 1.1rem; }
.crumbs a { text-decoration: none; }
.comp-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; padding-block: 12px 36px; }
@media (max-width: 880px) { .comp-layout { grid-template-columns: 1fr; } }
.doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.door { display: grid; gap: 6px; align-content: start; text-align: left; padding: 18px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; text-decoration: none; min-height: 132px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; color: var(--ink); }
a.door:hover, button.door:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.door > .ico { width: 34px; height: 34px; }
.door b { font-family: var(--f-sign); font-size: clamp(1.2rem, 4.6vw, 1.6rem); line-height: 1; overflow-wrap: anywhere; }
.door span { font-size: var(--s-0); color: var(--ink-2); line-height: 1.35; }
.door--window { grid-column: 1 / -1; cursor: default; background: linear-gradient(160deg, var(--paper), var(--bg-2)); }
.piece-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.piece-btn { position: relative; display: grid; justify-items: center; gap: 4px; padding: 12px 6px; border-radius: 16px; border: 1.5px solid var(--ink); background: var(--paper); cursor: pointer; font-family: var(--f-sign); font-weight: 700; font-size: 1.1rem; transition: transform .12s; }
.piece-btn:hover { background: var(--bg-2); }
.piece-btn .ico { width: 26px; height: 26px; }
.piece-btn.is-card::after { content: ""; position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--sign); box-shadow: 0 0 0 2px var(--paper); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.textdoor { padding-block: 10px 48px; scroll-margin-top: 70px; }
.textdoor article { max-width: 46rem; display: grid; gap: 22px; }
.textdoor h2 { font-family: var(--f-sign); font-size: var(--s-5); }
.textdoor h3 { font-family: var(--f-sign); font-size: 1.45rem; margin-bottom: 6px; }
.textdoor dl { margin: 0; display: grid; gap: 4px; }
.textdoor dt { font-weight: 700; }
.textdoor dd { margin: 0 0 8px; }
.textdoor details, details.panel { border-radius: 14px; }
.textdoor details { border: 1px solid var(--line); padding: 10px 14px; background: var(--paper); }
summary { cursor: pointer; font-weight: 700; }
.transcript { display: grid; gap: 6px; margin: 0; padding-left: 0; list-style: none; }
.transcript b { font-family: var(--f-sign); font-weight: 600; letter-spacing: .03em; }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; z-index: 40; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow: auto; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); animation: ovin .25s ease; }
@keyframes ovin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.ov--night { background: var(--night); color: var(--night-ink); --ink: var(--night-ink); --ink-2: var(--night-2); --line: #29342d; --paper: #121a15; --bg-2: #18221c; --focus: #ffd84d; color-scheme: dark; }
.ov--walk { background: radial-gradient(120% 70% at 50% 110%, rgba(246, 198, 0, calc(var(--walk-p, 0) * .28)), transparent 70%), linear-gradient(180deg, #070c0a, color-mix(in srgb, #1b3a33 calc(var(--walk-p, 0) * 100%), #0b110d)); }
.ov-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: inherit; flex-wrap: wrap; }
.ov-title { font-family: var(--f-sign); font-weight: 700; font-size: 1.3rem; margin-right: auto; }
.ov-body { flex: 1; display: grid; align-content: start; gap: 18px; width: 100%; max-width: 980px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
@media (max-width: 640px) { .ov-bar .badge { display: none; } }

.seg { display: flex; gap: 6px; padding: 5px; border-radius: 18px; background: var(--bg-2); border: 1px solid var(--line); overflow-x: auto; }
.seg-btn { flex: 1; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 8px 12px; border: 0; border-radius: 14px; background: transparent; cursor: pointer; min-width: 120px; color: var(--ink); }
.seg-btn span { font-family: var(--f-sign); font-weight: 700; font-size: 1.18rem; }
.seg-btn small { grid-column: 2; color: var(--ink-2); font-size: .78rem; }
.seg-btn .seg-ico { grid-row: span 2; width: 22px; height: 22px; }
.seg-btn[aria-selected="true"] { background: var(--sign); color: var(--sign-ink); }
.seg-btn[aria-selected="true"] small { color: var(--sign-ink); }
.seg-btn:not(:has(.seg-ico)) { grid-template-columns: 1fr; }
.seg-btn:not(:has(.seg-ico)) small { grid-column: 1; }

.stage { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 58vh; border-radius: 20px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); }
.ov--night .stage { background: #080d0a; border-color: #1d2822; }
.stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage svg, .stage canvas { display: block; width: 100%; height: 100%; }
.stage-start { display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding: 24px; background: inherit; z-index: 3; }
.stage-start p { max-width: 32em; color: var(--ink-2); }
.caption { min-height: 4.6em; font-size: var(--s-3); line-height: 1.4; text-align: center; max-width: 40em; margin: 0 auto; }
.caption small { display: block; font-family: var(--f-sign); font-weight: 600; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 2px; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--sign); transition: width .2s linear; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.quiz-btn { width: 56px; font-size: 1.5rem; }
.quiz-btn.right { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }

.listen { display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; padding: 20px; background: radial-gradient(circle at 50% 42%, #14231b, #050806 70%); --lvl: 0; }
.listen-rings { position: relative; width: clamp(120px, 26vw, 200px); aspect-ratio: 1; display: grid; place-items: center; }
.listen-rings i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(246, 198, 0, .5); transform: scale(calc(.55 + var(--lvl) * .5)); transition: transform .12s; }
.listen-rings i:nth-child(2) { inset: 12%; border-color: rgba(246, 198, 0, .35); transform: scale(calc(.7 + var(--lvl) * .6)); }
.listen-rings i:nth-child(3) { inset: 24%; border-color: rgba(246, 198, 0, .25); transform: scale(calc(.8 + var(--lvl) * .8)); }
.listen-core { width: 46%; aspect-ratio: 1; border-radius: 50%; background: var(--sign); display: grid; place-items: center; color: var(--sign-ink); }
.listen-ico { width: 50%; height: 50%; }
.listen-title { font-family: var(--f-sign); font-weight: 700; font-size: clamp(1.2rem, 3vw, 1.7rem); color: #eef3ec; }
.listen-hint { color: #a3b2a6; font-size: var(--s-1); }

.voices { display: flex; justify-content: center; align-items: center; gap: clamp(16px, 5vw, 60px); padding: 20px; }
.voice { display: grid; justify-items: center; gap: 12px; opacity: .45; transition: opacity .4s; }
.voice.on { opacity: 1; }
.voice-orb { width: clamp(56px, 12vw, 110px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--sign), var(--a-values)); }
.voice.on .voice-orb { animation: speak 1.1s ease-in-out infinite; }
@keyframes speak { 0%, 100% { box-shadow: 0 0 0 0 rgba(246, 198, 0, .45); transform: scale(1); } 50% { box-shadow: 0 0 0 18px rgba(246, 198, 0, 0); transform: scale(1.04); } }
.voice-label { font-family: var(--f-sign); font-weight: 600; font-size: 1.1rem; }
.voices--dark { background: #040605; }
.voices--dark .voice-label { display: none; }
.voices--dark .voice-orb { width: 18px; background: #c9d6cb; }
.seed { display: grid; justify-items: center; gap: 6px; }
.stage .seed svg { width: clamp(80px, 16vw, 150px); height: auto; overflow: visible; }
.seed .stem { transform-origin: 50% 100%; transform-box: fill-box; transform: scaleY(0); transition: transform 2.4s cubic-bezier(.2, .9, .3, 1); }
.seed .leaf { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); transition: transform 1.6s 1s cubic-bezier(.2, .9, .3, 1.3); }
.ad { display: grid; align-content: center; gap: 10px; padding: 7%; }
.ad--sky { background: linear-gradient(160deg, #8fc6ef, #e8f4fc 70%); color: #0b2a44; }
.ad--plain { background: #f4f1ec; color: #1d1d1d; }
.ad .brand { font-family: var(--f-sign); font-weight: 700; font-size: clamp(1.6rem, 5vw, 3rem); letter-spacing: .12em; }
.ad .claim { font-weight: 700; font-size: clamp(1.4rem, 4.4vw, 2.6rem); line-height: 1.1; }
.ad .fine { font-size: .8rem; opacity: .75; }
.layer { opacity: 0; transition: opacity 1.4s; }
.layer.on { opacity: 1; }
.layer.zoom { transform: scale(1.18); transition: opacity 1.4s, transform 16s linear; }
.layer.zoom.on { transform: scale(1); }
.year { position: absolute; inset: auto; left: 4%; top: 5%; font-family: var(--f-sign); font-weight: 700; font-size: clamp(2rem, 7vw, 4.4rem); color: var(--sign); text-shadow: 0 2px 10px rgba(0, 0, 0, .35); width: auto; height: auto; z-index: 2; }
.chain-node { transition: transform .5s; transform-box: fill-box; transform-origin: center; }
.chain-node .disc { fill: var(--paper); stroke: var(--line); stroke-width: 3; transition: fill .4s, stroke .4s; }
.chain-node.on .disc { fill: var(--sign); stroke: var(--sign); }
.chain-node.on { transform: scale(1.12); }
.chain-node text { fill: var(--ink); font-family: var(--f-sign); font-weight: 700; font-size: 26px; }
.chain-node .ic { stroke: var(--ink); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 5%; align-items: stretch; }
.steps3 > div { border-radius: 16px; border: 2px solid var(--ink); background: var(--paper); padding: 14px; display: grid; align-content: start; gap: 8px; opacity: .12; transform: translateY(12px); transition: opacity .7s, transform .7s; }
.steps3 > div.on { opacity: 1; transform: none; }
.steps3 b { font-family: var(--f-sign); font-size: clamp(1.1rem, 2.6vw, 1.6rem); line-height: 1.05; }
.steps3 .n { font-family: var(--f-sign); font-weight: 700; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; color: var(--a-acting); }
.steps3 p { font-size: clamp(.78rem, 1.6vw, .98rem); }
@media (max-width: 600px) { .steps3 { grid-template-columns: 1fr; padding: 3%; gap: 6px; } .steps3 > div { padding: 8px 10px; } .steps3 p { display: none; } }
.counter { position: absolute; inset: auto 0 6% 0; width: 100%; height: auto; text-align: center; font-family: var(--f-sign); font-weight: 700; font-size: clamp(2.4rem, 9vw, 5.5rem); color: var(--ink); z-index: 2; line-height: 1; }

/* ---------- five minutes ---------- */
.stepper { display: flex; gap: 6px; justify-content: center; }
.stepper i { width: 36px; height: 6px; border-radius: 3px; background: var(--line); }
.stepper i.done { background: var(--ink-2); }
.stepper i.now { background: var(--sign); }
.stepper.wide i { flex: 1; max-width: 60px; }
.five-card { border-left: 6px solid var(--area); }
/* the five trail cards lie in one row, side by side, never on top of each other */
.trail-fan { display: grid; grid-template-columns: repeat(5, minmax(0, 128px)); justify-content: center; gap: clamp(6px, 2vw, 14px); padding: 10px 0; }
.flip3d { width: 100%; aspect-ratio: 70 / 120; perspective: 900px; transition: opacity .5s, transform .5s; }
.flip3d-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.3, 1.3, .5, 1); }
.flip3d.flipped .flip3d-inner { transform: rotateY(180deg) scale(1.08); }
.flip3d.dim { opacity: .3; transform: scale(.94); }
.flip3d-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip3d-face .mini { width: 100%; height: 100%; }
.flip3d-back { transform: rotateY(180deg); }
.trail-fan.shuffling .flip3d { animation: shuffle .5s ease-in-out 2; }
.trail-fan.shuffling .flip3d:nth-child(2n) { animation-delay: .1s; }
@keyframes shuffle { 50% { transform: translateY(-16px) rotate(5deg); } }
.trail-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
.trail-row { align-items: stretch; }
.trail-row-card { width: clamp(170px, 30vw, 230px); flex: none; }
.spark-line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.spark-line .ico { color: var(--blaze); }
.wheel-wrap { display: grid; place-items: center; }
.wheel { width: min(300px, 78vw); height: auto; }
.wheel-t { font-family: var(--f-sign); font-weight: 700; font-size: 13px; fill: #fff; stroke: rgba(0, 0, 0, .35); stroke-width: 3px; paint-order: stroke; }
.wheel-rot { transform-origin: 0 0; }
.wheel-t--small { font-size: 10.5px; }
.hourglass { width: min(150px, 34vw); height: auto; display: block; margin: 0 auto; }
.hourglass .glass { fill: none; stroke: var(--ink); stroke-width: 3.5; }
.hourglass .sand { fill: var(--sign); }
.hourglass .frame { fill: var(--ink-2); }
.timer-grid { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 26px; align-items: center; }
@media (max-width: 640px) { .timer-grid { grid-template-columns: 1fr; } }
.clock { font-family: var(--f-sign); font-weight: 700; font-size: clamp(3rem, 12vw, 6.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.resting { position: fixed; inset: 0; z-index: 60; background: #000; display: grid; place-items: center; color: #4f5c52; font-family: var(--f-sign); font-size: 1.3rem; }

/* walk */
.walk-step { display: grid; gap: 14px; text-align: center; justify-items: center; padding-block: 10px; }
.walk-step h2 { font-family: var(--f-sign); font-size: var(--s-6); line-height: 1; }
.walk-step .say { font-size: clamp(1.25rem, 3.6vw, 1.75rem); line-height: 1.4; max-width: 30em; }
.walk-ico { width: 54px; height: 54px; color: var(--sign); }
.walk-settings { text-align: left; width: min(560px, 100%); }
.sig-chips { margin: 0; }
.walk-dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.walk-dots i { width: 30px; height: 7px; border-radius: 4px; background: var(--line); }
.walk-dots i.done { background: var(--ink-2); }
.walk-dots i.now { background: var(--sign); }
.breath { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--sign); animation: breath 8s ease-in-out infinite; }
@keyframes breath { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }

/* training */
.train { display: grid; gap: 18px; max-width: 860px; }
.train-card { border-left: 6px solid var(--area); }
input[type="range"] { width: 100%; accent-color: var(--a-complex); min-height: 34px; }

/* ---------- forms ---------- */
label { font-weight: 700; }
.field { display: grid; gap: 6px; }
input[type="text"], input[type="number"], input[type="url"], select, textarea { width: 100%; min-height: 46px; padding: 9px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); }
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--focus); outline-offset: 0; }
.scale { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.scale legend { font-weight: 700; margin-bottom: 6px; padding: 0; }
.scale-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.scale-row label { position: relative; font-weight: 700; }
.scale-row input { position: absolute; opacity: 0; inset: 0; }
.scale-row span { display: grid; place-items: center; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-family: var(--f-sign); font-size: 1.2rem; cursor: pointer; }
.scale-row input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.scale-row input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.scale-ends { display: flex; justify-content: space-between; gap: 10px; font-size: var(--s-0); color: var(--ink-2); }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.panel h3 { font-family: var(--f-sign); font-size: 1.6rem; }
.note { border-left: 4px solid var(--sign); padding: 6px 0 6px 12px; color: var(--ink-2); font-size: var(--s-1); }
.note.warn { border-color: var(--blaze); color: var(--ink); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--s-1); }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-sign); font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; }
td.num, th.num { text-align: right; }
.meter { display: inline-block; width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--a-values) var(--v), var(--line) var(--v)); vertical-align: middle; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border: 2px solid var(--blaze); border-radius: 14px; }

/* ---------- pages ---------- */
.page-head { padding-block: 34px 18px; display: grid; gap: 12px; }
.page-head h1 { font-family: var(--f-sign); font-weight: 700; font-size: clamp(2.4rem, 5.6vw, 4rem); line-height: .98; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.stats { gap: 12px; }
.stat { display: grid; padding: 10px 16px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); font-family: var(--f-sign); font-weight: 600; color: var(--ink-2); }
.stat b { font-size: 1.8rem; color: var(--ink); line-height: 1; }

/* my way */
.way-wrap { border-radius: 26px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: var(--way-sky); }
.way-map { display: block; width: 100%; height: auto; }
.way-sky { fill: var(--way-sky); }
.way-sun { fill: var(--sign); opacity: .85; }
.way-m1 { fill: var(--way-m1); }
.way-m2 { fill: var(--way-m2); }
.way-snow { fill: var(--way-snow); }
.way-tree { fill: var(--way-tree); }
.way-path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-dasharray: 2 12; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
.way-flag path { stroke: var(--ink); stroke-width: 3; fill: none; }
.way-flag .way-flag-cloth { fill: var(--blaze); stroke: none; }
.way-label { font-family: var(--f-sign); font-weight: 700; font-size: 20px; fill: var(--ink); }
.way-pt { cursor: pointer; }
.way-dot { fill: var(--paper); stroke: var(--ink); stroke-width: 3; transition: transform .2s; transform-box: fill-box; transform-origin: center; }
.way-pt:hover .way-dot, .way-pt:focus .way-dot { transform: scale(1.12); }
.way-pt.done .way-dot { fill: var(--wc); stroke: var(--paper); }
.way-pt.next .way-dot { fill: var(--sign); }
.way-n { font-family: var(--f-sign); font-weight: 700; font-size: 22px; fill: var(--ink); pointer-events: none; }
.way-pt.next .way-n { fill: var(--sign-ink); }
.way-check { fill: none; stroke: var(--on-area); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.way-pulse { fill: none; stroke: var(--sign); stroke-width: 3; animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(.75); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.week { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); }
.week .foot { grid-row: span 3; width: 34px; height: 34px; color: var(--line); }
.week.done .foot { color: var(--area); }
.week b { font-family: var(--f-sign); font-size: 1.2rem; line-height: 1.05; }
.week small { color: var(--ink-2); }
.promise-card { border: 1px solid var(--line); border-top: 3px dashed var(--line); border-radius: 16px; padding: 14px 16px; background: var(--paper); display: grid; gap: 8px; }
.days { display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 12px; border-radius: 999px; background: var(--bg-2); font-family: var(--f-sign); font-weight: 600; }

/* finds */
.finds { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.find { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); }
.find-token { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed var(--line); color: var(--ink-2); }
.find.got .find-token { background: var(--fc); border: 0; color: #fff; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15), 0 6px 14px -8px var(--fc); }
.find-ico { width: 28px; height: 28px; }
.find-text { display: grid; gap: 2px; min-width: 0; }
.find-text b { font-family: var(--f-sign); font-size: 1.2rem; line-height: 1.05; }
.find-text small { color: var(--ink-2); line-height: 1.3; }
.find:not(.got) .find-text b { color: var(--ink-2); }
.find--small { padding: 0; border: 0; background: none; gap: 10px; }
.find--small .find-token { width: 40px; height: 40px; }
.find--small .find-ico { width: 22px; height: 22px; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 999px; background: var(--head); color: var(--head-ink); box-shadow: var(--shadow-lift); animation: toastin .45s cubic-bezier(.2, 1.3, .4, 1); }
.toast .find-text b { color: var(--head-ink); }
.toast-label { font-family: var(--f-sign); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: .85rem; opacity: .8; }
.toast.out { opacity: 0; transform: translateY(10px); transition: all .4s; }
@keyframes toastin { from { transform: translateY(30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
.celebrate { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 70; }

/* guide */
.guide, .guide-body { display: grid; gap: 44px; }
.guide-sec { display: grid; gap: 18px; }
.quick { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.quick li { position: relative; display: grid; gap: 8px; padding: 20px; border-radius: 22px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); }
.quick b { font-family: var(--f-sign); font-size: 1.4rem; line-height: 1.05; }
.quick span:last-child { color: var(--ink-2); }
.quick-n { position: absolute; top: 14px; right: 16px; font-family: var(--f-sign); font-weight: 700; font-size: 2.4rem; line-height: 1; color: var(--sign); -webkit-text-stroke: 1px var(--sign-ink); }
@media (max-width: 900px) { .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .quick { grid-template-columns: 1fr; } }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.icon-tile { display: grid; gap: 8px; align-content: start; padding: 18px; border-radius: 20px; background: var(--paper); border: 1px solid var(--line); }
.icon-tile h4 { font-family: var(--f-sign); font-size: 1.35rem; }
.icon-tile p { color: var(--ink-2); }
.bag { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.bag-tile { position: relative; display: grid; gap: 4px; padding: 16px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); --area: var(--ink-2); }
.bag-tile .bag-shape { position: absolute; top: 16px; right: 16px; }
.bag-tile b { font-family: var(--f-sign); font-size: 2.2rem; line-height: 1; }
.bag-tile h4 { font-family: var(--f-sign); font-size: 1.2rem; }
.bag-tile p { color: var(--ink-2); font-size: var(--s-1); }
.extras { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.timeline { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.tl-seg { display: grid; align-content: center; gap: 2px; min-width: 64px; min-height: 76px; padding: 8px 10px; border: 0; border-radius: 12px; cursor: pointer; text-align: left; color: #fff; font-family: var(--f-sign); background: var(--ink-2); }
.tl-seg span { font-weight: 700; font-size: 1.05rem; line-height: 1.05; }
.tl-seg small { font-size: .82rem; opacity: .9; }
.tl-s1 { background: var(--a-values); } .tl-s2 { background: var(--a-complex); } .tl-s3 { background: var(--a-futures); } .tl-s4 { background: var(--a-acting); }
.tl-promise { background: var(--a-values); filter: saturate(.6); } .tl-leader { background: var(--sign); color: var(--sign-ink); }
:root[data-theme="dark"] .tl-seg:not(.tl-leader), .ov--night .tl-seg:not(.tl-leader) { color: #0e1511; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tl-seg:not(.tl-leader) { color: #0e1511; } }
.station-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.station-list li { display: grid; grid-template-columns: 70px 140px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 10px 14px; border-radius: 14px; background: var(--bg-2); }
.station-list li .num { font-family: var(--f-sign); font-weight: 700; font-size: 1.2rem; }
@media (max-width: 600px) { .station-list li { grid-template-columns: 60px 1fr; } .station-list li span:last-child { grid-column: 1 / -1; } }
.steps-list { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: var(--s-2); }
.checklist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.checklist li { padding-left: 30px; position: relative; }
.checklist li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--a-values); color: var(--on-area); display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.easy { display: grid; gap: 26px; max-width: 40rem; font-size: 1.3rem; line-height: 1.7; }
.easy h2 { font-family: var(--f-sign); font-size: 2.2rem; }
.easy ul { margin: 0; padding-left: 26px; }
.try { padding: 24px; border-radius: 24px; background: var(--bg-2); }

/* ---------- board (Tafel) ---------- */
.board-tabs { scroll-margin-top: 80px; display: flex; gap: 6px; flex-wrap: wrap; padding-block: 18px 10px; }
.board-tabs button { font-family: var(--f-sign); font-weight: 700; font-size: 1.15rem; padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--paper); cursor: pointer; }
.board-tabs button[aria-current="step"] { background: var(--ink); color: var(--bg); }
.standings { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); }
.stand { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: var(--bg-2); font-family: var(--f-sign); font-weight: 600; }
.stand i { width: 12px; height: 12px; border-radius: 50%; background: var(--gc); }
.stand-icons { opacity: .7; font-size: .9rem; }
.board { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.25fr); gap: 22px; padding-block: 16px 44px; align-items: start; }
@media (max-width: 980px) { .board { grid-template-columns: 1fr; } }
.station-sign { --tip: 26px; font-size: clamp(1.5rem, 3vw, 2.1rem); min-height: 70px; }
.viz-canvas { width: 100%; height: 90px; display: block; border-radius: 12px; background: var(--bg-2); }
.phases { display: grid; gap: 8px; }
.phase { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; text-align: left; font-family: var(--f-sign); font-weight: 600; font-size: 1.2rem; }
.phase[aria-current="step"] { border-color: var(--sign); background: var(--sign); color: var(--sign-ink); }
.est-q { font-weight: 700; font-size: clamp(1.4rem, 2.8vw, 2.1rem); line-height: 1.2; }
.est-kind { display: inline-flex; justify-self: start; font-family: var(--f-sign); font-weight: 700; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 3px 12px; border-radius: 999px; }
.group-inputs { display: grid; gap: 8px; }
.group-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 190px); gap: 10px; align-items: center; }
.group-row .tf { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.group-row .tf input { width: 64px; min-height: 40px; text-align: center; }
.group-name { font-family: var(--f-sign); font-weight: 700; font-size: 1.25rem; display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.group-name i { width: 14px; height: 14px; border-radius: 50%; background: var(--gc); flex: none; }
.group-setup { display: grid; gap: 8px; padding: 12px; border-radius: 16px; background: var(--bg-2); }
.players { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.player-chip { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: var(--paper); padding-left: 4px; }
.player-chip .player-in { border: 0; min-height: 34px; width: 120px; padding: 4px 8px; background: transparent; }
.player-chip .x { border: 0; background: none; cursor: pointer; font-size: 1.2rem; padding: 0 10px; color: var(--ink-2); }
.track { display: grid; gap: 8px; }
.track-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.pts-group { display: grid; gap: 6px; padding: 10px 12px; border-radius: 14px; background: var(--bg-2); }
.pts-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pts-name { flex: 1; min-width: 100px; font-weight: 700; }
.pts-total { min-width: 2.2em; text-align: center; font-family: var(--f-sign); font-size: 1.5rem; }
.pts-total.pop { animation: pop .4s; }
@keyframes pop { 50% { transform: scale(1.4); color: var(--a-values); } }
.answer-big { font-family: var(--f-sign); font-weight: 700; font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: 1; }
.reveal-pop { animation: revealpop .7s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes revealpop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.viz { width: 100%; }
.viz svg { width: 100%; height: auto; display: block; overflow: visible; }
.viz text { fill: var(--ink); font-family: var(--f-sign); font-weight: 600; }
.viz .muted-t { fill: var(--ink-2); }
.viz .axis { stroke: var(--ink-2); stroke-width: 2; }
.viz .grid { stroke: var(--line); stroke-width: 1; }
.viz canvas { width: 100%; height: auto; display: block; }
.winner { text-align: center; display: grid; gap: 8px; justify-items: center; padding: 28px 16px 0; position: relative; overflow: hidden; border-radius: 26px; background: linear-gradient(170deg, var(--paper), var(--bg-2)); border: 1px solid var(--line); }
.winner canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.winner h2 { font-family: var(--f-sign); font-size: clamp(2.6rem, 8vw, 5rem); line-height: 1; position: relative; }
.winner p { position: relative; }
.podium { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 8px; width: min(520px, 100%); margin-top: 14px; }
.podium-step { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 10px 6px 0; border-radius: 14px 14px 0 0; background: var(--gc); color: #fff; font-family: var(--f-sign); font-weight: 700; }
.podium-step span { font-size: 1.05rem; text-align: center; }
.podium-step i { font-style: normal; font-size: 2rem; line-height: 1.2; opacity: .85; }
.podium-step.p1 { min-height: 150px; } .podium-step.p2 { min-height: 110px; } .podium-step.p3 { min-height: 84px; }
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.vote { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); border-left: 6px solid var(--gc); background: var(--paper); cursor: pointer; }
.vote b { font-family: var(--f-sign); font-size: 1.5rem; grid-row: span 2; }
.vote small { color: var(--ink-2); }
.vote:active { transform: scale(.97); }
.master-card { position: relative; display: grid; justify-items: center; gap: 6px; text-align: center; padding: 26px; border-radius: 26px; color: #2a1f05; background: linear-gradient(140deg, #fbe7a1, #f6c600 45%, #d9a400); box-shadow: 0 20px 40px -20px rgba(214, 160, 0, .9); width: min(420px, 100%); justify-self: center; animation: revealpop .8s cubic-bezier(.2, 1.4, .4, 1); }
.master-card h2 { font-family: var(--f-sign); font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1; }
.master-card .eyebrow { color: #4a3a0c; }
.master-ico { width: 54px; height: 54px; }
.silence-ov { display: grid; place-items: center; align-content: center; gap: 22px; text-align: center; min-height: 60vh; }
.silence-ov .breath { width: 180px; height: 180px; }
.silence-draw .mini { width: clamp(200px, 60vw, 250px); }
.steps-list li::marker { font-family: var(--f-sign); font-weight: 700; }

/* ---------- footer ---------- */
.foot-site { border-top: 1px solid var(--line); margin-top: 20px; }
.foot-site .wrap { padding-block: 28px 40px; display: grid; gap: 10px; font-size: var(--s-1); color: var(--ink-2); }
.foot-site a { color: var(--ink); }
.foot-links { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--f-sign); font-weight: 600; font-size: 1.1rem; }

.qr { aspect-ratio: 1; background: var(--qr-bg); border-radius: 6px; }
.qr svg { display: block; width: 100%; height: 100%; }
.qr--text { font-size: .6rem; word-break: break-all; padding: 4px; color: var(--qr-ink); display: grid; place-items: center; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .layer.zoom { transform: none; }
}
/* ---------- «Play now» on the start page ---------- */
.hero-play { margin-top: 26px; display: grid; gap: 14px; padding: 18px; border-radius: 26px; background: rgba(8, 18, 12, .42); border: 1px solid rgba(255, 255, 255, .22); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 640px; }

/* the briefing: what one station holds, with minutes */
/* «what this is about» at the start of the briefing */

@media (max-width: 560px) {
  .hero-play { padding: 14px; margin-top: 18px; }

}
.nav a.nav-play { background: var(--sign); color: var(--sign-ink); display: inline-flex; align-items: center; gap: 6px; }
.nav a.nav-play .ico { width: 16px; height: 16px; fill: currentColor; }

@media (max-width: 760px) {
  .tabbar a.tab-play { opacity: 1; }
  .tabbar a.tab-play .tab-ico { width: 44px; height: 44px; padding: 10px 9px 10px 12px; margin-top: -20px; border-radius: 50%; background: var(--sign); color: var(--sign-ink); fill: currentColor; box-shadow: 0 6px 16px -6px rgba(0, 0, 0, .7), 0 0 0 4px var(--head); }
  .tabbar a.tab-play[aria-current="page"] { color: var(--sign); }
}
.door--play { grid-column: 1 / -1; min-height: 0; background: var(--sign); color: var(--sign-ink); border-color: var(--sign); grid-template-columns: auto 1fr; align-items: center; column-gap: 14px; }
.door--play .ico { grid-row: span 2; width: 40px; height: 40px; padding: 9px 7px 9px 11px; border-radius: 50%; background: var(--sign-ink); color: var(--sign); fill: currentColor; }
.door--play span { color: var(--sign-ink); opacity: .85; }

/* ---------- «Play now»: the guided game ---------- */
.play { padding-block: 22px 40px; display: grid; gap: 16px; }
.play-top { display: grid; gap: 10px; }
.play-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
