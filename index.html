.play-meta .btn { margin-left: auto; }
@media (max-width: 600px) { .play-meta .btn { min-height: 38px; padding: 6px 12px; font-size: 1rem; } }
.play-prog { display: flex; gap: 6px; }
.play-prog .ph { flex: var(--w) 1 0; min-width: 0; display: grid; gap: 5px; }
.play-prog .ph span { font-family: var(--f-sign); font-weight: 600; font-size: .92rem; letter-spacing: .03em; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.play-prog .ph.now span { color: var(--ink); }
.play-prog .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.play-prog .bar i { display: block; height: 100%; border-radius: 4px; background: var(--sign); transition: width .45s cubic-bezier(.3, 1, .4, 1); }
.play-prog .ph.done .bar i { background: var(--a-values); }
@media (max-width: 600px) { .play-prog .ph:not(.now) span { visibility: hidden; } .play-prog .ph { flex-basis: 0; } .play-prog .ph.now { flex-grow: calc(var(--w) + 4); } }
.play-step { --area: var(--sign); display: grid; gap: 18px; padding: 26px; border-radius: 28px; background: var(--paper); border: 1px solid var(--line); border-top: 6px solid var(--area); box-shadow: var(--shadow-lift); min-width: 0; }
.play-step.in { animation: stepin .45s cubic-bezier(.2, .9, .3, 1.1); }
@keyframes stepin { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
.play-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.play-num { width: 62px; height: 62px; border-radius: 50%; background: var(--sign); color: var(--sign-ink); display: grid; place-items: center; font-family: var(--f-sign); font-weight: 700; font-size: 1.9rem; flex: none; }
.play-num .ico { width: 30px; height: 30px; }
.play-head h1 { font-family: var(--f-sign); font-weight: 700; font-size: clamp(2rem, 6vw, 3.3rem); line-height: .98; }
.play-head h1:focus { outline: none; }
.play-read span { margin-left: 2px; }
.play-say { font-size: var(--s-3); line-height: 1.45; max-width: 40em; }
.play-body { gap: 18px; }
.play-nav { position: sticky; bottom: 12px; z-index: 15; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); box-shadow: var(--shadow-lift); }
.play-hint { flex: 1; min-width: 0; font-size: var(--s-0); color: var(--ink-2); text-align: center; }
.play-next { min-width: min(260px, 52vw); }
.play-next.is-wait { background: var(--bg-2); border-color: var(--line); color: var(--ink-2); box-shadow: none; }
.play-next.is-hot { animation: hot 1.6s ease-in-out infinite; }
.play-next.nudge { animation: nudge .4s; }
@keyframes hot { 50% { box-shadow: 0 0 0 10px rgba(246, 198, 0, .25); } }
@keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (max-width: 760px) { .play-nav { bottom: calc(78px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 600px) {
  .play-step { padding: 18px; border-radius: 22px; gap: 14px; }
  .play-head { grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
  .play-num { width: 48px; height: 48px; font-size: 1.5rem; }
  .play-read { grid-column: 1 / -1; justify-self: start; }
  .play-next { min-width: 0; flex: 1 1 auto; }
  .hide-xs { display: none; }
}
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.choice { display: grid; gap: 6px; justify-items: start; text-align: left; padding: 18px; border-radius: 22px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, border-color .15s, box-shadow .15s; }
.choice:hover { transform: translateY(-2px); border-color: var(--ink-2); box-shadow: var(--shadow-lift); }
.choice[aria-pressed="true"] { border-color: var(--sign); background: color-mix(in srgb, var(--sign) 16%, var(--paper)); }
.choice-ico { width: 52px; height: 52px; border-radius: 16px; background: var(--sign); color: var(--sign-ink); display: grid; place-items: center; }
.choice-ico .ico { width: 28px; height: 28px; }
.choice b { font-family: var(--f-sign); font-size: 1.6rem; line-height: 1.02; }
.choice span:last-child { color: var(--ink-2); font-size: var(--s-1); }
.name-list { display: grid; gap: 8px; max-width: 460px; }
.name-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.name-n { width: 34px; height: 34px; border-radius: 50%; background: var(--pc); color: #fff; display: grid; place-items: center; font-family: var(--f-sign); font-weight: 700; }
.name-row input { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); padding: 8px 12px; font-size: var(--s-2); width: 100%; }
.name-row .x { border: 0; background: none; cursor: pointer; font-size: 1.5rem; color: var(--ink-2); min-width: 40px; min-height: 40px; }
.name-list > .btn { justify-self: start; }
.big-list { font-size: var(--s-2); gap: 12px; }
.big-list li { padding-left: 34px; }
.roles-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.roles-list li { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--bg-2); }
.roles-list b { font-family: var(--f-sign); font-size: 1.3rem; }
.roles-list span:last-child { color: var(--ink-2); font-size: var(--s-1); }
.role-ico { width: 34px; height: 34px; border-radius: 50%; background: var(--sign); color: var(--sign-ink); display: grid; place-items: center; }
.role-ico .ico { width: 18px; height: 18px; }
@media (max-width: 520px) { .roles-list li { grid-template-columns: auto 1fr; } .roles-list span:last-child { grid-column: 2; } }
.draw-card { max-width: 560px; width: 100%; }
.deck { position: relative; display: block; width: min(280px, 76%); aspect-ratio: 70 / 120; margin: 10px auto; border: 0; background: none; cursor: pointer; padding: 0; }
.deck-c, .deck-top { position: absolute; inset: 0; border-radius: 22px; }
.deck-c { background: var(--bg-2); border: 1px solid var(--line); }
.deck-c:nth-child(1) { transform: rotate(-6deg) translate(-10px, 6px); }
.deck-c:nth-child(2) { transform: rotate(4deg) translate(8px, 2px); }
.deck-top { display: grid; place-items: center; align-content: center; gap: 14px; background: repeating-linear-gradient(135deg, var(--a-values) 0 14px, color-mix(in srgb, var(--a-values) 80%, #000) 14px 28px); color: #fff; border: 4px solid var(--paper); box-shadow: var(--shadow-lift); transition: transform .2s; }
.deck:hover .deck-top { transform: translateY(-6px) rotate(-1deg); }
.deck-top b { font-family: var(--f-sign); font-size: 1.7rem; padding: 8px 18px; border-radius: 999px; background: var(--sign); color: var(--sign-ink); }
.deck-ico { width: 60px; height: 60px; }
.paper-chips { margin: 12px 0 0; }
.draw-card { margin-inline: auto; }
.play-body .stack > .btn { justify-self: start; }

.est-card { border-left: 6px solid var(--area); display: grid; gap: 6px; }
.talk-row { align-items: center; gap: 18px 24px; }
.station-go { border-left: 6px solid; }
.talk-slot { width: clamp(220px, 32vw, 300px); flex: none; }
.talk-slot .mini { width: 100%; }
@media (max-width: 560px) { .talk-slot { width: min(290px, 80vw); margin-inline: auto; } }
.timer-grid--plain .breath { margin: 0 auto; }
.est-inputs { display: grid; gap: 8px; }
.guess-row { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 220px) auto; gap: 10px; align-items: center; padding-left: 10px; border-left: 5px solid var(--pc); }
.guess-row label, .guess-name { font-family: var(--f-sign); font-weight: 700; font-size: 1.2rem; }
.guess-row input { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); padding: 6px 10px; width: 100%; font-size: var(--s-2); }
.guess-row .row { grid-column: 2 / -1; }
@media (max-width: 520px) { .guess-row { grid-template-columns: 1fr auto; } .guess-row label, .guess-row .guess-name { grid-column: 1 / -1; } .guess-row .row { grid-column: 1 / -1; } }
.pts-list { display: flex; flex-wrap: wrap; gap: 8px; }
.pts-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); font-family: var(--f-sign); font-weight: 600; font-size: 1.1rem; }
.pts-chip b { min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 999px; background: var(--bg-2); }
.pts-chip.got { border-color: var(--pc); }
.pts-chip.got b { background: var(--pc); color: #fff; }
.vote-rows { display: grid; gap: 10px; margin-top: 10px; }
.vote-row { display: grid; gap: 6px; padding-left: 10px; border-left: 5px solid var(--pc); }
.vote-row .chips { margin: 0; }
.score-list { margin: 8px 0; padding: 0; list-style: none; counter-reset: sc; display: grid; gap: 6px; }
.score-list li { counter-increment: sc; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--bg-2); font-family: var(--f-sign); font-size: 1.3rem; }
.score-list li::before { content: counter(sc); width: 30px; height: 30px; border-radius: 50%; background: var(--pc); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; }
.score-list b { font-size: 1.5rem; }

/* ---------- v0.4: steps on the cards ---------- */
.card-plain { font-size: var(--s-0); color: var(--ink-2); margin-top: -6px; }
.card-plain::before { content: "= "; color: var(--area); font-weight: 700; }
.task-steps { margin: 0; padding-left: 1.5em; display: grid; gap: 4px; line-height: 1.38; }
.task-ex { display: block; font-size: .86em; font-style: italic; color: var(--ink-2); }
.task-steps li::marker { font-family: var(--f-sign); font-weight: 700; color: var(--area); }
.task-done { font-size: var(--s-0); color: var(--ink-2); }
/* The printed card (70 x 120 mm) has to hold name, everyday words, question, three steps, the end and the QR code. */
.timeline .tl-choose { background: var(--blaze); } .timeline .tl-debrief { background: var(--a-complex); filter: saturate(.7); }

/* ---------- v0.4: briefing ---------- */
.brief-sec { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.brief-more > summary { font-weight: 700; cursor: pointer; }
.brief-more .brief-sec:first-child { border-top: 0; padding-top: 0; }
.e4c { padding: 12px 14px; border-radius: 14px; background: var(--bg-2); }
/* the task, one step per screen: large enough to read out loud from arm's length */
.task-now { display: grid; gap: 10px; border-left: 6px solid var(--area); }
.task-now-text { font-size: clamp(1.35rem, 4.2vw, 1.75rem); line-height: 1.3; font-weight: 700; }
.task-now .task-ex { font-size: var(--s-2); }
.task-now .task-done { font-size: var(--s-2); font-weight: 700; color: var(--ink); }
.task-dots { display: flex; gap: 8px; }
.task-dots i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.task-dots i.on { background: var(--area); }
.closest { font-weight: 700; }
.leader-card { background: linear-gradient(140deg, #d8f0d0, #9fd18d 45%, #5fae4e); color: #10260a; box-shadow: 0 20px 40px -20px rgba(60, 130, 40, .9); }
.leader-card .eyebrow { color: #1f3d14; }
/* the comparison round on the board: every group's choice side by side, to photograph */
.compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.compare-card { display: grid; gap: 6px; align-content: start; padding: 14px 16px; border-radius: 16px; background: var(--paper); border: 1px solid var(--line); border-top: 6px solid var(--area, var(--gc)); }
.compare-choice { font-family: var(--f-sign); font-weight: 700; font-size: 1.5rem; line-height: 1.1; }
.compare-verdict { font-weight: 700; color: var(--a-values); }
.compare-verdict.is-changed { color: var(--blaze); }
.brief-sec h3 { font-family: var(--f-sign); font-size: 1.45rem; }
.run-bar { display: flex; gap: 4px; }
.run-seg { flex: 1 1 0; min-width: 0; display: grid; gap: 2px; padding: 8px 8px 7px; border-radius: 10px; background: var(--bg-2); border-top: 4px solid var(--ink-2); }
.run-seg b { font-family: var(--f-sign); font-size: .98rem; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-seg small { font-size: .78rem; color: var(--ink-2); }
.run-start { border-top-color: var(--sign); } .run-choose { border-top-color: var(--blaze); }
.run-st1 { border-top-color: var(--a-values); } .run-st2 { border-top-color: var(--a-complex); } .run-st3 { border-top-color: var(--a-futures); } .run-st4 { border-top-color: var(--a-acting); }
.run-debrief { border-top-color: var(--a-complex); } .run-end { border-top-color: var(--sign); }
@media (min-width: 601px) { .run-seg { min-width: 74px; } .play-prog .ph { min-width: 64px; } }
@media (max-width: 600px) { .run-bar { flex-wrap: wrap; } .run-seg { flex: 1 1 28%; } }
.rules3 { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: var(--s-2); }
.rules3 li::marker { font-family: var(--f-sign); font-weight: 700; }

/* ---------- v0.4: choosing ---------- */
.pick-status { font-family: var(--f-sign); font-weight: 700; font-size: 1.2rem; }
.pick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .pick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .pick-grid { grid-template-columns: 1fr; } }
.pick-area { display: grid; gap: 8px; align-content: start; }
.pick-area-name { font-family: var(--f-sign); font-weight: 700; font-size: 1.05rem; letter-spacing: .03em; color: var(--area); border-bottom: 3px solid var(--area); padding-bottom: 4px; }
.pick-tile { position: relative; }
.pick-add { width: 100%; display: grid; gap: 4px; text-align: left; padding: 12px 12px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; transition: border-color .15s, transform .12s; }
button.pick-add:hover { border-color: var(--area); }
button.pick-add:active { transform: scale(.98); }
.pick-add b { font-family: var(--f-sign); font-size: 1.22rem; line-height: 1.05; padding-right: 26px; }
.pick-add span { font-size: var(--s-0); color: var(--ink-2); line-height: 1.3; }
.pick-dots { display: flex; flex-wrap: wrap; gap: 4px; min-height: 0; }
.pick-dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--area); box-shadow: 0 0 0 2px var(--paper); }
.pick-tile.has-dots .pick-add { border-color: var(--area); }
.pick-tile.is-chosen .pick-add { border-color: var(--area); background: color-mix(in srgb, var(--area) 14%, var(--paper)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--area) 35%, transparent); }
.pick-minus { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font-weight: 700; line-height: 1; }
.pick-grid--static .pick-add { cursor: default; }
/* on the board the twelve skills sit in the narrower left column: two areas side by side, never four squeezed */
.pick-grid--static { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 520px) { .pick-grid--static { grid-template-columns: 1fr; } }
.pick-add b, .pick-add span, .pick-area-name { hyphens: auto; overflow-wrap: anywhere; }
.pick-grid--static .pick-add b { padding-right: 0; }
.chosen-panel { display: grid; gap: 4px; padding: 16px 18px; border-radius: 18px; border-left: 6px solid var(--area); background: color-mix(in srgb, var(--area) 10%, var(--paper)); }
.chosen-panel h3 { font-family: var(--f-sign); font-size: 1.6rem; }
.chosen-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

/* ---------- v0.4: debrief and group card ---------- */
.recap { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.recap li { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--bg-2); border-left: 5px solid var(--area); }
.recap li b { font-family: var(--f-sign); font-size: 1.2rem; }
.recap li span { font-size: var(--s-1); color: var(--ink-2); }
.thumb-verdict { font-weight: 700; }
.thumb-verdict.is-ok { color: var(--a-values); }
.thumb-verdict.is-no { color: var(--blaze); }
.group-card { display: grid; gap: 10px; padding: 18px 20px; border-radius: 20px; border: 2px dashed var(--a-values); background: var(--paper); }
.group-card dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; }
.group-card dt { font-family: var(--f-sign); font-weight: 700; color: var(--ink-2); }
.group-card dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .group-card dl { grid-template-columns: 1fr; } .group-card dd { margin-bottom: 6px; } }
.group-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.copy-area { width: 100%; min-height: 120px; }
.debrief-q { display: grid; gap: 6px; }
.debrief-q h3 { font-family: var(--f-sign); font-size: 1.5rem; }
.clock--small { font-size: 2rem; }

/* ---------- v0.4: preparation ---------- */
.prep { display: grid; gap: 16px; }
.prep h2 { font-family: var(--f-sign); font-size: var(--s-5); }
.prep-progress { display: inline-flex; align-self: start; justify-self: start; margin-top: 8px; padding: 4px 14px; border-radius: 999px; background: var(--bg-2); font-family: var(--f-sign); font-weight: 700; font-size: 1.1rem; }
.prep-progress.is-done { background: var(--a-values); color: var(--on-area); }
.prep-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.prep-list label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; }
.prep-list input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--a-values); }
.prep-list b { display: block; font-family: var(--f-sign); font-size: 1.25rem; line-height: 1.1; }
.prep-list small { display: block; color: var(--ink-2); font-size: var(--s-1); margin-top: 2px; }
.prep-list label:has(input:checked) { border-color: var(--a-values); background: color-mix(in srgb, var(--a-values) 8%, var(--paper)); }
.prep-list label:has(input:checked) b { text-decoration: line-through; text-decoration-color: var(--a-values); }
.plan-table { width: 100%; max-width: 460px; }
.plan-table td, .plan-table th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.plan-table .num { text-align: right; }

/* ---------- v0.5: cards on the table, the large view, area signs, the joker, round 0 ---------- */
/* area signs: colour is never the only cue */
.card-sym { width: 1.2em; height: 1.2em; flex: none; stroke-width: 2.2; }
.card-type > span { min-width: 0; }
.area-big { width: 44cqi; height: 44cqi; margin: auto; stroke-width: 1.6; }
.mini.is-area .big { margin-top: 0; }
.eyebrow-sym { width: 1.15em; height: 1.15em; vertical-align: -.22em; margin-right: .3em; color: var(--area, currentColor); }
.post-head { min-width: 0; }
.post-sym { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--area); color: var(--on-area); flex: none; }
.post-sym .area-sym { width: 18px; height: 18px; stroke-width: 2.3; }
.sign-sym { display: inline-grid; place-items: center; }
.sign-sym .area-sym { width: 1.1em; height: 1.1em; stroke-width: 2.3; }

/* in the game, a phone shows only the game: no tab bar over the cards */
@media (max-width: 760px) {
  body.in-game { padding-bottom: env(safe-area-inset-bottom, 0px); }
  body.in-game .tabbar { display: none; }
  body.in-game .play-nav { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  body.in-game .toasts { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
}

/* a drawn card lies on the table at a readable size, the instruction beside it */
.card-row { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 26px; }
.card-slot { width: clamp(180px, 28vw, 250px); flex: none; }
.card-slot .mini { width: 100%; }
.card-side { flex: 1 1 240px; min-width: 0; align-content: center; }
@media (max-width: 560px) { .card-row { flex-direction: column; align-items: stretch; } .card-slot { width: min(240px, 66vw); align-self: center; } }
.zoomable { cursor: zoom-in; transition: transform .15s, box-shadow .15s; }
.zoomable:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.zoomable:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* the large view of one card */
.ov--cards { background: var(--bg-2); }
.cv { display: grid; justify-items: center; gap: 14px; padding-top: 4px; }
.cv-stage { width: min(400px, 100%, calc((100dvh - 250px) * 70 / 120)); min-width: min(230px, 100%); touch-action: pan-y; cursor: pointer; user-select: none; -webkit-user-select: none; }
.cv-stage .mini { width: 100%; box-shadow: var(--shadow-lift); }
.cv-tools { justify-content: center; }
.cv-nav { width: 54px; padding: 0; font-size: 1.4rem; }
.cv-hint, .cv-count { text-align: center; }
.cv-in-r { animation: cvr .28s ease-out; } .cv-in-l { animation: cvl .28s ease-out; }
@keyframes cvr { from { transform: translateX(36px); opacity: 0; } }
@keyframes cvl { from { transform: translateX(-36px); opacity: 0; } }

/* the joker: a star at the edge; blank ones have a dashed frame to write in */
.edge-star { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); border-radius: 0; }
.mini.is-blank { border: 2px dashed var(--ink-2); }
.mini.is-joker-back { background: radial-gradient(circle at 28% 18%, color-mix(in srgb, var(--sign) 38%, var(--paper)), var(--paper) 62%); }
.mini.is-joker-back .big { font-size: 1.5em; }
.mini.is-joker-back .card-q { font-size: .92em; }
.mini.is-joker .lines { gap: 6.3cqi; margin-top: 4.2cqi; }
.mini .joker-lines li i { display: block; height: 5.9cqi; border-bottom: 1.5px dashed var(--line); }
.card-near { font-size: var(--s-0); color: var(--ink-2); font-style: italic; margin-top: -6px; }
.mini .card-near { font-size: .66em; line-height: 1.22; margin-top: -2.1cqi; }
.card--big.is-joker { border: 2px solid var(--area); }
.joker-offer { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.joker-note { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 18px; }
.joker-rules { margin-top: 16px; }
.joker-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.joker-item { display: grid; gap: 8px; align-content: start; }
.joker-list .mini, .joker-item .mini { width: 100%; }

/* the joker editor: fields, the card as it will look, a short language check */
.je { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(230px, 300px); gap: 28px; align-items: start; }
.je-side { position: sticky; top: 76px; }
.je-preview .mini { width: 100%; }
.je-steps { border: 0; padding: 0; margin: 0; min-width: 0; }
.je-steps legend { font-weight: 700; padding: 0; margin-bottom: 4px; }
.je-step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; }
.je-n { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--f-sign); font-weight: 700; }
.je-check h3 { font-size: 1.3rem; }
.je-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--s-1); }
.je-checks li.ok span { color: var(--a-values); font-weight: 700; }
.je-checks li.todo { color: var(--ink-2); }
.je-checks li.warn { color: var(--blaze); font-weight: 700; }
.je-own summary { cursor: pointer; font-size: var(--s-1); color: var(--ink-2); margin-top: 6px; }
.je-own .field { margin-top: 8px; }
@media (max-width: 760px) { .je { grid-template-columns: 1fr; } .je-side { position: static; } .je-preview { width: min(280px, 80vw); margin-inline: auto; } }

/* round 0: a UN goal first, as in the original */
.r0 h3 { font-family: var(--f-sign); font-size: 1.6rem; }
.r0 .eyebrow .ico, .r0-offer summary .ico, .tf-sdg .ico { width: 1.2em; height: 1.2em; vertical-align: -.25em; }
.r0-offer summary { cursor: pointer; font-weight: 700; }
.r0-offer p { margin-top: 8px; }
.sdg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.sdg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 7px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font-size: var(--s-1); line-height: 1.2; }
.sdg b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); font-family: var(--f-sign); font-size: 1.15rem; }
.sdg[aria-checked="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--sign) 18%, var(--paper)); }
.sdg[aria-checked="true"] b { background: var(--ink); color: var(--paper); }
.tf-sdg { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
.tf-sdg .ico { color: var(--ink-2); }

/* home: two new tiles fill the last row */
.tile--wide { grid-column: span 2; }
@media (max-width: 560px) { .tile--wide { grid-column: auto; } }

/* ---------- v0.6: the coaster after a scan, the twelve coasters, print data ---------- */
.found { background: radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--sign) 14%, var(--bg)), var(--bg) 62%); }
.found-grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 40px; align-items: center; padding-block: 32px 48px; }
.found-coaster { display: grid; justify-items: center; gap: 10px; perspective: 1200px; }
.found-coaster .coaster { width: min(340px, 78vw); }
.found-turn { color: var(--ink-2); }
.found-text h1 { font-family: var(--f-sign); font-weight: 700; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1; }
.found-play { justify-self: start; min-width: min(320px, 100%); }
.found-collect { display: grid; gap: 8px; }
.found-dots { display: flex; flex-wrap: wrap; gap: 6px; }
.found-dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--line); }
.found-dots i.got { background: var(--fc); border: 2px solid color-mix(in srgb, var(--fc) 70%, #000); }
@media (max-width: 760px) {
  .found-grid { grid-template-columns: 1fr; gap: 18px; padding-top: 18px; }
  .found-coaster .coaster { width: min(250px, 64vw); }
  .found-play { width: 100%; justify-self: stretch; }
}
.coaster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 26px 22px; }
.coaster-tile { display: grid; gap: 6px; justify-items: center; text-align: center; align-content: start; }
.coaster-pic { width: 100%; max-width: 240px; border-radius: 50%; cursor: zoom-in; filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .28)); transition: transform .2s; }
.coaster-pic:hover { transform: translateY(-3px) rotate(-3deg); }
.coaster-pic:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
.coaster-tile .row { justify-content: center; gap: 2px; }
.cv-stage .coaster-svg { width: 100%; border-radius: 50%; filter: drop-shadow(0 16px 24px rgba(0, 0, 0, .35)); }
.coaster-page h2 { font-family: var(--f-sign); font-size: 1.9rem; }
.spec-table { max-width: 720px; }
.spec-table th { white-space: nowrap; padding-right: 14px; vertical-align: top; }
.cprint { display: none; }
@page press { size: 113mm 113mm; margin: 0; }
@page proof { size: A4; margin: 12mm; }

@media print {
  @page { size: A4; margin: 10mm; }
  body { background: #fff; padding: 0; }
  .site, .tabbar, .foot-site, .no-print, .chips, .page-head p, .page-head .row, .try, .toasts { display: none !important; }
  .set-grid { grid-template-columns: repeat(2, 70mm); gap: 4mm; justify-content: center; }
  .mini { width: 70mm; box-shadow: none; break-inside: avoid; border: .3mm solid #999; }
  /* mirrored rows: printed on both sides and turned on the long edge, every back lands behind its front */
  .set-grid.is-backs { direction: rtl; }
  .set-grid.is-backs > * { direction: ltr; }
  .zoomable { cursor: default; transform: none !important; }
  /* print data for coasters: only the coaster pages, each exactly 113 x 113 mm, or two per A4 sheet as a proof */
  body.printing-coasters > *:not(.cprint) { display: none !important; }
  body.printing-coasters .cprint { display: block; }
  .cprint.is-press .cprint-page { page: press; width: 113mm; height: 113mm; overflow: hidden; break-after: page; }
  .cprint.is-proof .cprint-page { page: proof; width: 113mm; height: 113mm; margin: 0 auto 8mm; break-inside: avoid; }
  .cprint svg { display: block; width: 113mm; height: 113mm; }
  .guide-sec, .booklet-item { break-inside: avoid; }
  .panel, .tile, .quick li, .icon-tile { box-shadow: none; }
}
